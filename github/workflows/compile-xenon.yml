name: Compile Xbox 360 Homebrew (LibXenon)
run-name: Build ${{ inputs.build_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique build ID'
        required: true
        type: string
      code_b64:
        description: 'Base64 encoded C++ source'
        required: true
        type: string

jobs:
  build-xenon-elf:
    runs-on: ubuntu-latest
    container:
      image: free60/libxenon:latest

    steps:
      - name: Prepare C++ Source
        env:
          CODE_B64: ${{ inputs.code_b64 }}
        run: |
          mkdir -p src build
          printf '%s' "$CODE_B64" | base64 -d > src/main.cpp

      - name: Compile C++ with xenon-g++
        run: |
          export DEVKITXENON=/usr/local/xenon
          export PATH="$PATH:$DEVKITXENON/bin:$DEVKITXENON/usr/bin"
          xenon-g++ -O2 -Wall -mcpu=cell -mtune=cell \
            -I$DEVKITXENON/usr/include \
            -L$DEVKITXENON/usr/lib \
            src/main.cpp -lxenon -lm -o build/xenon.elf

      - name: Upload xenon.elf Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xenon-elf
          path: build/xenon.elf
          retention-days: 1
